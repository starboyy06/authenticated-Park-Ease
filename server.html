<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 Park Ease - Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 450px;
      width: 90%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .login-title {
      font-size: 32px;
      margin-bottom: 10px;
      color: #333;
      font-weight: 700;
    }
    
    .login-subtitle {
      color: #555;
      font-size: 16px;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    
    .auth-btn {
      display: inline-block;
      background: linear-gradient(135deg, #3888ca, #25ebc0);
      color: #fff;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 235, 192, 0.4);
      letter-spacing: 0.5px;
    }
    
    .auth-btn:hover {
      background: linear-gradient(135deg, #1976c2, #0fc79f);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(37, 235, 192, 0.5);
    }
    
    .park-ease-logo {
      font-size: 70px;
      margin-bottom: 20px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .features {
      display: flex;
      justify-content: center;
      margin-top: 40px;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .feature {
      text-align: center;
      flex: 1;
      min-width: 100px;
    }
    
    .feature-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .feature-text {
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 40px 30px;
      }
      
      .login-title {
        font-size: 26px;
      }
      
      .park-ease-logo {
        font-size: 50px;
      }
      
      .features {
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="park-ease-logo">🚗</div>
      <h1 class="login-title">Park Ease</h1>
      <p class="login-subtitle">Smart Parking Management System for Modern Businesses</p>
      
      <!-- IMPORTANT: Update YOUR_DOMAIN below with your actual URL -->
      <!-- Examples:
           - Local: http://127.0.0.1:5500/INDEX.html
           - Live Server: http://localhost:3000/INDEX.html
           - Online: https://yourdomain.com/INDEX.html
      -->
    <a href="https://grid-lock-server.vercel.app/?redirect-uri=https://starboyy06.github.io/authenticated-Park-Ease/index.html" class="auth-btn">
    🔐 Sign in with GridAuth
</a>
      <div class="features">
        <div class="feature">
          <div class="feature-icon">🔒</div>
          <div class="feature-text">Secure Access</div>
        </div>
        <div class="feature">
          <div class="feature-icon">📊</div>
          <div class="feature-text">Analytics</div>
        </div>
        <div class="feature">
          <div class="feature-icon">⚡</div>
          <div class="feature-text">EV Charging</div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
